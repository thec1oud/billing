repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2 # Matches your installed v2 version exactly
    hooks:
      - id: golangci-lint
        pass_filenames: false
        args: ["./..."]

  - repo: local
    hooks:
      - id: no-package-level-loggers
        name: Ban package-level loggers
        entry: '^var log = logger\.ForComponent'
        language: pygrep
        types: [go]
        message: "Package-level loggers are banned. Initialize the logger inside constructors or functions."
