repos:
- repo: local
  hooks:
  - id: go-fmt
    name: gofmt
    entry: gofmt -s -w
    language: system
    files: \.(go)$
  - id: go-imports
    name: goimports
    entry: goimports -w
    language: system
    files: \.(go)$
  - id: go-vet
    name: govet
    entry: go vet ./...
    language: system
    files: \.(go)$
  - id: golangci-lint
    name: golangci-lint
    entry: golangci-lint run
    language: system
    files: \.(go)$
