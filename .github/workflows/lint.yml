name: Lint

on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev, main ]

# Cancel in-progress runs on the same branch/PR if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: runner / golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod' # Dynamically reads Go version from your go.mod
          cache: true               # Caches Go build modules automatically

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
