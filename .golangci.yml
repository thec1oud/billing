version: "2"

run:
  timeout: 5m
  tests: true
  go: '1.26'

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - lll
    - revive

  settings:
    lll:
      line-length: 140
    revive:
      rules:
        - name: receiver-naming
        - name: blank-imports
        - name: error-return
        - name: error-strings

  exclusions:
    paths:
      - third_party
      - vendor

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/thec1oud/billing)
      custom-order: true
  exclusions:
    paths:
      - third_party
      - vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
