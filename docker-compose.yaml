
services:
  mock-identity:
    build:
      context: ./platform/bff
      dockerfile: Dockerfile
    command: ["node", "src/dev/mock-identity-server.js"]
    environment:
      PORT: "8090"
      MOCK_IDENTITY_ISSUER: ${AUTH_ISSUER:-http://mock-identity:8090}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-billing-api}
    ports:
      - "127.0.0.1:${MOCK_IDENTITY_HOST_PORT:-8090}:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  billing-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      SEED_DB: ${SEED_DB:-false}
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      ENABLE_DEV_ENDPOINTS: ${ENABLE_DEV_ENDPOINTS:-true}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://mock-identity:8090/.well-known/jwks.json}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://mock-identity:8090}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-billing-api}
      FAKE_WEBHOOK_HMAC_SECRET: ${FAKE_WEBHOOK_HMAC_SECRET:-local-development-only-webhook-secret-12345}
      DB_HOST: ${DB_HOST:-app-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-billing}
      DB_PASSWORD: ${DB_PASSWORD:-billing_local_dev}
      DB_NAME: ${DB_NAME:-billing}
      REDIS_HOST: ${REDIS_HOST:-app-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_dev}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-app-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-billing}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-rabbit_local_dev}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: local-receipts
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      app-db:
        condition: service_healthy
      app-redis:
        condition: service_healthy
      app-rabbitmq:
        condition: service_healthy
      mock-identity:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${APP_PORT:-8080}/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  platform-bff:
    build:
      context: ./platform/bff
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BFF_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      APP_ENV: ${APP_ENV:-development}
      ENABLE_DEV_ENDPOINTS: ${ENABLE_DEV_ENDPOINTS:-true}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://mock-identity:8090/.well-known/jwks.json}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://mock-identity:8090}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-billing-api}
      FAKE_WEBHOOK_HMAC_SECRET: ${FAKE_WEBHOOK_HMAC_SECRET:-local-development-only-webhook-secret-12345}
      PORT: "3000"
      BILLING_SERVICE_URL: http://billing-service:${APP_PORT:-8080}
      TRUST_PROXY: "true"
      CORS_ORIGIN: "true"
    depends_on:
      billing-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./platform/web
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_MOCK_AUTH: "true"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8081}:80"
    depends_on:
      platform-bff:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  app-db:
    image: postgres:16-alpine
    container_name: billing_db
    environment:
      POSTGRES_USER: ${DB_USER:-billing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-billing_local_dev}
      POSTGRES_DB: ${DB_NAME:-billing}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - billing_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-billing} -d ${DB_NAME:-billing}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app-redis:
    image: redis:7-alpine
    container_name: billing_redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_local_dev}
    volumes:
      - billing_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_local_dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: billing_rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-billing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbit_local_dev}
      RABBITMQ_LOGS: "level=warning"
      VM_MEMORY_HIGH_WATERMARK: "0.7"              # Prevents early memory threshold alarms
    volumes:
      - billing_rabbitmq_data:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: billing_minio
    profiles: ["dev"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - billing_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: minio/mc:latest
    profiles: ["dev"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      if ! mc ls myminio/local-receipts; then
        mc mb myminio/local-receipts
      fi
      "

volumes:
  billing_db_data:
  billing_redis_data:
  billing_rabbitmq_data:
  billing_minio_data:
